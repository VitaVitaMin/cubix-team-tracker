name: Cubix Team Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-team:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Чтение репозитория
        uses: actions/checkout@v4.2.2

      - name: Настройка Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Выполнение скрипта
        run: python main.py

      - name: Сохранение изменений в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем файлы, только если они существуют
          [ -f state.json ] && git add state.json
          [ -f changes_log.json ] && git add changes_log.json

          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-update team state [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Нет изменений для коммита"
          fi
